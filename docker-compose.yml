services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: haiyu-mqtt
    expose:
      - "1883"
    environment:
      MQTT_USERNAME: "${MQTT_USERNAME:?set MQTT_USERNAME}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:?set MQTT_PASSWORD}"
      MQTT_EDGE_USERNAME: "${MQTT_EDGE_USERNAME:?set MQTT_EDGE_USERNAME}"
      MQTT_EDGE_PASSWORD: "${MQTT_EDGE_PASSWORD:?set MQTT_EDGE_PASSWORD}"
    command:
      - sh
      - -c
      - >
        mosquitto_passwd -b -c /tmp/mosquitto.passwd "$$MQTT_USERNAME"
        "$$MQTT_PASSWORD" &&
        mosquitto_passwd -b /tmp/mosquitto.passwd "$$MQTT_EDGE_USERNAME"
        "$$MQTT_EDGE_PASSWORD" &&
        {
          echo "user $$MQTT_USERNAME";
          echo "topic read haiyu/+/status";
          echo "topic read haiyu/+/track";
          echo "topic read haiyu/+/alarm";
          echo "topic read haiyu/+/sensor";
          echo "topic read haiyu/+/lwt";
          echo "";
          echo "pattern write haiyu/%u/status";
          echo "pattern write haiyu/%u/track";
          echo "pattern write haiyu/%u/alarm";
          echo "pattern write haiyu/%u/sensor";
          echo "pattern write haiyu/%u/lwt";
        } > /tmp/mosquitto.acl &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: haiyu-influxdb
    expose:
      - "8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: "${INFLUXDB_USERNAME:?set INFLUXDB_USERNAME}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUXDB_PASSWORD:?set INFLUXDB_PASSWORD}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUXDB_ORG:-haiyu}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUXDB_BUCKET:-haiyu}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN}"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    container_name: haiyu-api
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      API_TOKEN: "${API_TOKEN:?set API_TOKEN}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      MQTT_ENABLED: "${MQTT_ENABLED:-true}"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_USERNAME: "${MQTT_USERNAME:?set MQTT_USERNAME}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:?set MQTT_PASSWORD}"
      MQTT_REQUIRE_CREDENTIALS: "${MQTT_REQUIRE_CREDENTIALS:-true}"
      MQTT_EVENT_HMAC_SECRET: "${MQTT_EVENT_HMAC_SECRET:?set MQTT_EVENT_HMAC_SECRET}"
      MQTT_ALLOWED_DEVICE_IDS: "${MQTT_ALLOWED_DEVICE_IDS:?set MQTT_ALLOWED_DEVICE_IDS}"
      MQTT_TLS_ENABLED: "${MQTT_TLS_ENABLED:-false}"
      MQTT_TLS_CA_CERT: "${MQTT_TLS_CA_CERT:-}"
      MQTT_TLS_CLIENT_CERT: "${MQTT_TLS_CLIENT_CERT:-}"
      MQTT_TLS_CLIENT_KEY: "${MQTT_TLS_CLIENT_KEY:-}"
      MQTT_TLS_INSECURE: "${MQTT_TLS_INSECURE:-false}"
      MQTT_AUTO_RECONNECT: "${MQTT_AUTO_RECONNECT:-true}"
      MQTT_RECONNECT_MAX_ATTEMPTS: "${MQTT_RECONNECT_MAX_ATTEMPTS:-}"
      INFLUXDB_URL: "http://influxdb:8086"
      INFLUXDB_ORG: "${INFLUXDB_ORG:-haiyu}"
      INFLUXDB_BUCKET: "${INFLUXDB_BUCKET:-haiyu}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN}"
      WEBSOCKET_MAX_CONNECTIONS: "${WEBSOCKET_MAX_CONNECTIONS:-100}"
      WEBSOCKET_ALLOW_QUERY_TOKEN: "${WEBSOCKET_ALLOW_QUERY_TOKEN:-false}"
      # Development risk marker; real auth is API tokens plus MQTT ACL/HMAC.
      AUTH_MODE: "${AUTH_MODE:-placeholder-risk}"
    depends_on:
      - mqtt
      - influxdb
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: haiyu-frontend
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
      VITE_WS_BASE_URL: "${VITE_WS_BASE_URL:-ws://localhost:8000}"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mosquitto-data:
  influxdb-data:
